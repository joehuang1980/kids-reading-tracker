<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>我的閱讀紀錄</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2937; background: #f7f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
    main { width: min(100%, 720px); margin: 0 auto; }
    .card { background: #fff; border-radius: 22px; padding: 28px; box-shadow: 0 8px 28px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: clamp(30px, 6vw, 44px); }
    p { margin: 0; font-size: 18px; line-height: 1.6; }
    .status { margin-top: 24px; padding: 16px; border-radius: 14px; background: #eef7ee; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>📚 我的閱讀紀錄</h1>
      <p>家庭閱讀紀錄系統正在建置中。</p>
      <div class="status">✓ GitHub Pages 首頁骨架載入成功</div>
    </section>
  </main>
</body>
</html>
