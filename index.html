<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="閱讀紀錄">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>我的閱讀紀錄</title>
</head>
<body>
  <main>
    <section class="card">
      <h1>📚 我的閱讀紀錄</h1>

      <!-- Stage 4: ISBN input + camera scan button -->
      <label for="isbn">ISBN</label>
      <div class="btn-row">
        <input id="isbn" type="text" inputmode="numeric" autocomplete="off"
               placeholder="例如：9789864796747" aria-describedby="isbnHint">
        <button id="scanBtn" class="btn-scan" type="button"
                title="相機掃描 ISBN" aria-label="相機掃描 ISBN">📷</button>
      </div>
      <div id="isbnHint" class="hint">可輸入含連字號的 ISBN-10 / ISBN-13，或點 📷 相機掃描。</div>

      <!-- Stage 4: Scanner container -->
      <div id="scanner-container" class="hidden">
        <div id="reader"></div>
        <div class="scanner-hint">對準書背條碼，保持 10–30 cm</div>
      </div>

      <button id="lookupBtn" type="button" class="mt-4">查詢書籍</button>

      <div id="status" class="status hidden" role="status" aria-live="polite"></div>

      <!-- Stage 13: Book result with cover image -->
      <div id="result" class="book-result hidden">
        <img id="bookCover" class="book-cover hidden" alt="書籍封面">
        <div id="coverPh" class="book-cover-ph">📖</div>
        <div class="book-info">
          <div class="hint">書名</div>
          <div id="bookTitle" class="book-title"></div>
          <!-- Stage 14: Author / publisher -->
          <div id="bookMeta" class="book-meta"></div>
        </div>
      </div>

      <!-- Fallback manual title input -->
      <div id="manualBox" class="hidden">
        <label for="manualTitle">手動輸入書名</label>
        <input id="manualTitle" type="text" autocomplete="off"
               placeholder="若系統查不到，可在此輸入書名">
      </div>

      <!-- Stage 5: Complete form -->
      <div id="formBox" class="hidden">
        <div class="divider"></div>

        <label for="readingDate">閱讀日期</label>
        <input id="readingDate" type="date">

        <label for="readerSelect">閱讀者</label>
        <select id="readerSelect"></select>

        <!-- Stage 8: Submit button -->
        <button id="submitBtn" class="btn-success mt-4" type="button">送出閱讀紀錄</button>
      </div>

      <!-- Stage 16: Offline queue badge -->
      <button id="syncBadge" class="sync-badge hidden" type="button"
              aria-label="等待同步的離線紀錄，點擊重試">
        ⏳ 等待同步
      </button>
    </section>
  </main>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" aria-label="主選單">
    <a href="index.html"     class="nav-item active"><span class="nav-icon">➕</span>新增</a>
    <a href="history.html"   class="nav-item"><span class="nav-icon">📋</span>紀錄</a>
    <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span>統計</a>
  </nav>

  <!-- Stage 4: html5-qrcode for barcode scanning -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/isbn.js"></script>
  <script src="js/api.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/app.js"></script>

  <!-- Stage 15: PWA service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
